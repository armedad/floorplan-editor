[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floorplan-editor"
version = "0.1.0"
description = "Edit architectural floor plans as JSON (walls, doors, counters, fixtures) in a local browser editor, and render SVG, PNG, and overlays on the source sheet."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pillow>=10",
    "httpx>=0.27",
    "mcp>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
floorplan = "floorplan_editor.__main__:main"
floorplan-mcp = "floorplan_editor.mcp_server:main"

[tool.setuptools.packages.find]
include = ["floorplan_editor*"]

[tool.setuptools.package-data]
floorplan_editor = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
